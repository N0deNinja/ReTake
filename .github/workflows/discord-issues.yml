name: Discord issues

on:
  issues:
    types: [opened, closed, reopened]

permissions:
  contents: read

jobs:
  discord:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Post to Discord
        run: node .github/discord/post-issue.mjs
        env:
          ISSUES_WEBHOOK: ${{ secrets.DISCORD_ISSUES_WEBHOOK }}
